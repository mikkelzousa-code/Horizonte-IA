<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Conocedores IA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/legal.css">
<style>
  .error-wrap{
    min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:64px 24px;
  }
  .error-code{
    font-family:var(--font-display); font-weight:800; font-size:clamp(64px,14vw,120px);
    background:var(--gradient-1); -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1;
  }
  .error-wrap h1{margin:16px 0 12px;}
  .error-wrap p{max-width:420px; margin-bottom:32px;}
  .error-wrap svg{width:64px; height:64px; stroke:var(--violet); fill:none; stroke-width:1.4; margin-bottom:20px; opacity:0.7;}
  .btn-home{
    background:var(--gradient-1); color:#fff; font-weight:700; font-size:15px;
    padding:14px 28px; border-radius:100px; text-decoration:none; display:inline-block;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="/" class="logo">Conocedores IA</a>
  </div>
</header>

<div class="error-wrap">
  <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="2"/><circle cx="20" cy="6" r="1.4"/><circle cx="17" cy="17" r="2"/><path d="M9 9L17 17M9 9L20 6"/></svg>
  <span class="error-code">404</span>
  <h1>Esta ruta no existe en la red.</h1>
  <p>Parece que el enlace que seguiste está roto o la página se movió. Volvamos al mapa principal.</p>
  <a href="/" class="btn-home">Ir al inicio</a>
</div>

<footer>
  <p>© 2026 Conocedores IA.</p>
</footer>
</body>
</html>
